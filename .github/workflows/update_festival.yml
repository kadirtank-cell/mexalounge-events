name: Update Festival Countdown

on:
  schedule:
    # Her gün UTC 00:00'da çalışır (Türkiye saati ile sabah 03:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel tetiklenebilmesini sağlar

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actions'ın repoya commit atabilmesi için yazma izni

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python script
        run: python festival.py

      - name: Check for changes and commit to repo
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          git add festival.json
          # Eğer dosya içeriğinde bir değişiklik olduysa commit at ve GitHub'a gönder
          git diff --staged --quiet || git commit -m "chore: otomatik festival.json güncellendi [skip ci]"
          git push
